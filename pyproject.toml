[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-drf"
version = "0.1.3"
description = "Authentication package for Django REST Framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    {name = "Sahil", email = "sahilsheoran24@gmail.com"}
]

dependencies = [
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
]

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE.txt"]

[tool.setuptools.packages.find]
where = ["src"]