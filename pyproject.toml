[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-drf"
version = "0.1.8"
description = "Authentication package for Django REST Framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    {name = "Sahil", email = "sahilsheoran24@gmail.com"}
]

dependencies = [
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "google-auth>=2.55.1",
    "requests>=2.34.2",
]

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "build>=1.5.0",
    "twine>=6.2.0",
    "django>=5.0",
]
